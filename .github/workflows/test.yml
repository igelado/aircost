name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false

      - name: Verify pinned toolchains
        run: |
          rust_expected="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          node_expected="$(tr -d '[:space:]' < .node-version)"
          test "$(rustc --version | awk '{print $2}')" = "$rust_expected"
          test "$(node --version)" = "v$node_expected"
          . /etc/os-release
          test "$VERSION_ID" = "24.04"
          printf 'runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Chrome extension
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/popup.js
          node --test chrome-extension/*.test.mjs

      - name: Check web frontend
        run: |
          node --check web/app.js
          node --check web/avionics.js
          node --check web/review.js
          node --check web/review/domain.mjs
          node --test web/review/*.test.mjs

      - name: Run unit tests
        run: cargo test --locked

      - name: Check build
        run: cargo check --locked

  sqlite-contracts:
    name: sqlite-contracts
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install schema test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep sqlite3
          command -v rg
          command -v sqlite3

      - name: Run SQLite schema contracts
        run: bash tests/schema/run.sh sqlite

  postgres-contracts:
    name: postgres-contracts
    runs-on: ubuntu-24.04
    env:
      AIRCOST_TEST_POSTGRES_URL: postgres://postgres:aircost@localhost:5432/aircost_test
      AIRCOST_TEST_POSTGRES_ADMIN_URL: postgres://postgres:aircost@localhost:5432/postgres
      AIRCOST_TEST_POSTGRES_DATABASE: aircost_test

    services:
      postgres:
        image: postgres:17.11-trixie@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_DB: aircost_test
          POSTGRES_PASSWORD: aircost
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install database test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client ripgrep sqlite3
          command -v psql
          command -v rg
          command -v sqlite3

      - name: Verify PostgreSQL version
        run: |
          test "$(
            psql "$AIRCOST_TEST_POSTGRES_URL" \
              --no-psqlrc -Atc 'SHOW server_version_num'
          )" = "170011"
          case "$(
            psql "$AIRCOST_TEST_POSTGRES_URL" \
              --no-psqlrc -Atc 'SHOW server_version'
          )" in
            17.11*) ;;
            *) exit 1 ;;
          esac
          psql --version

      - name: Verify ignored Rust test inventory
        run: |
          : "${AIRCOST_TEST_POSTGRES_URL:?AIRCOST_TEST_POSTGRES_URL is required}"
          bash tests/schema/rust_test_inventory.sh

      - name: Run PostgreSQL Rust contracts
        run: |
          : "${AIRCOST_TEST_POSTGRES_URL:?AIRCOST_TEST_POSTGRES_URL is required}"
          bash tests/schema/rust_test_inventory.sh run-postgres

      - name: Run PostgreSQL schema contracts
        run: |
          : "${AIRCOST_TEST_POSTGRES_URL:?AIRCOST_TEST_POSTGRES_URL is required}"
          bash tests/schema/run.sh postgres

  dnn:
    name: dnn
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Run DNN feature tests
        run: cargo test --locked --features dnn

      - name: Check DNN feature build
        run: cargo check --locked --features dnn
