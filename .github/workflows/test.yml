name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      AIRCOST_TEST_POSTGRES_URL: postgres://postgres:aircost@localhost:5432/aircost_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aircost_test
          POSTGRES_PASSWORD: aircost
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Chrome extension
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/popup.js
          node --test chrome-extension/*.test.mjs

      - name: Check web frontend
        run: |
          node --check web/app.js
          node --check web/avionics.js
          node --check web/review.js
          node --check web/review/domain.mjs
          node --test web/review/*.test.mjs

      - name: Run unit tests
        run: cargo test

      - name: Check PostgreSQL listing replay contract
        run: |
          cargo test postgres_listing_replay_fresh_migrated_idempotent_and_hostile_search_path -- --ignored --nocapture --test-threads=1
          cargo test postgres_listing_replay_installed_at_survives_two_normal_startups -- --ignored --nocapture --test-threads=1
          cargo test postgres_listing_replay_startup_rejects_weakened_column_constraint_and_index -- --ignored --nocapture --test-threads=1
          cargo test postgres_listing_replay_rerun_rejects_unexpected_indexes_and_triggers -- --ignored --nocapture --test-threads=1
          cargo test postgres_replay_ledger_rejects_invalid_state_outcome_pairings -- --ignored --nocapture --test-threads=1

      - name: Check PostgreSQL grounded avionics capability contract
        run: |
          cargo test postgres_grounded_capability_functions_resist_hostile_search_path_and_tampering -- --ignored --nocapture --test-threads=1
          cargo test postgres_grounded_capability_migration_rerun_preserves_nonempty_rows_exactly -- --ignored --nocapture --test-threads=1

      - name: Check historical migration provenance
        run: bash tests/schema/test_historical_migration_provenance.sh

      - name: Check listing aircraft identity migration
        run: bash tests/schema/test_listing_aircraft_identity.sh

      - name: Check PostgreSQL FAA reference migration
        run: bash tests/schema/test_faa_reference_reachability_postgres.sh

      - name: Check FAA record hash-domain migration
        run: bash tests/schema/test_faa_record_hash_domain.sh

      - name: Check PostgreSQL FAA reference startup attestation
        run: >-
          cargo test postgres_faa_reference_startup_attests_exact_objects --
          --ignored --nocapture --test-threads=1

      - name: Check FAA diagnostic read-only boundaries
        run: |
          cargo test diagnostic_postgres_connections_default_to_read_only -- --ignored --nocapture --test-threads=1
          cargo test --bin aircost-admin import_faa_registry_dry_run_keeps_postgres_rows_and_markers_unchanged -- --ignored --nocapture --test-threads=1

      - name: Check avionics reuse-v2 migration
        run: bash tests/schema/test_avionics_product_reuse_v2.sh

      - name: Check grounded avionics consolidation migration
        run: bash tests/schema/test_avionics_grounded_exact_consolidation.sh

      - name: Check build
        run: cargo check
