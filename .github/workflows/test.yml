name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aircost_seed_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aircost_seed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIRCOST_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/aircost_seed_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Chrome extension
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/popup.js
          node --test chrome-extension/*.test.mjs

      - name: Check web frontend
        run: |
          node --check web/app.js
          node --check web/avionics.js
          node --check web/review.js
          node --check web/review/domain.mjs
          node --test web/review/*.test.mjs

      - name: Run unit tests
        run: cargo test

      - name: Check avionics reuse-v2 migration
        run: bash tests/schema/test_avionics_product_reuse_v2.sh

      - name: Check grounded avionics consolidation migration
        run: bash tests/schema/test_avionics_grounded_exact_consolidation.sh

      - name: Check build
        run: cargo check
